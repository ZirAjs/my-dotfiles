set -g status on
set -g status-position bottom
set -g status-interval 5

set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26] "
set -g status-right "#[fg=#565f89]#(whoami) #[fg=#7dcfff]%Y-%m-%d #[fg=#bb9af7]%H:%M "

setw -g window-status-format " #[fg=#565f89]#I:#W "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7,bold] #I:#W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

set -g message-style "bg=#24283b,fg=#c0caf5"
set -g message-command-style "bg=#24283b,fg=#7dcfff"

setw -g mode-style "bg=#7aa2f7,fg=#1a1b26,bold"

set -g clock-mode-colour "#7aa2f7"
