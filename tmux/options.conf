unbind C-b
unbind C-a
set -g prefix C-Space

# Prefer Zsh when available; otherwise keep tmux's default shell.
run-shell 'if zsh_path=$(command -v zsh); then tmux set-option -g default-shell "$zsh_path"; fi'

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g escape-time 0
set -s set-clipboard on
set -g focus-events on

setw -g mode-keys vi
set -g mouse on
