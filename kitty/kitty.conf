font_family      JetBrains Mono
font_size        11

enable_audio_bell no
clipboard_control write-primary write-clipboard
window_padding_width 5
background_opacity 0.8
enabled_layouts grid,vertical,stack

# Add a status bar
# 아래쪽에 tab/status bar 항상 표시
#tab_bar_edge bottom
#tab_bar_min_tabs 1
#tab_bar_style separator
#tab_separator ""

# 현재 layout, window 개수, 활성 window 제목 표시
# tab_title_template "{layout_name} [{num_windows}] {title}"
# active_tab_title_template "{fmt.bold}{layout_name} [{num_windows}] {title}{fmt.nobold}"

cursor_shape beam
allow_remote_control no
map shift+enter send_text all \e\r
